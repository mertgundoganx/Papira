name: Bug report
description: Something renders incorrectly, throws, or is slower than expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest `Document.Create(...)` snippet that reproduces the issue.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output, exception or screenshot
      description: Stack trace, or a screenshot/attachment of the generated PDF if the problem is visual.
  - type: input
    id: version
    attributes:
      label: Papira version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: .NET version, OS, and PDF viewer if relevant.
      placeholder: .NET 10, Ubuntu 24.04, Adobe Acrobat
