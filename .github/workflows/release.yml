name: Release

# Publishes to NuGet when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # NuGet trusted publishing (OIDC)

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test -c Release --blame-hang-timeout 5m

      - name: Pack
        run: dotnet pack src/Papira -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --title "Papira ${{ steps.version.outputs.value }}"
          --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          Package: https://www.nuget.org/packages/Papira/${{ steps.version.outputs.value }}"
          ${{ contains(steps.version.outputs.value, '-') && '--prerelease' || '' }}
