name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --blame-hang-timeout 5m

  test-container:
    name: Test in container without fonts
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Remove any system fonts
        run: rm -rf /usr/share/fonts /usr/local/share/fonts

      - name: Test
        run: dotnet test -c Release -f net10.0 --blame-hang-timeout 5m

      - name: Generate sample documents
        run: |
          dotnet run -c Release --project samples/Papira.Samples -- invoice
          dotnet run -c Release --project samples/Papira.Samples -- features

  validate-output:
    name: Validate generated PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Generate sample documents
        run: |
          dotnet run -c Release --project samples/Papira.Samples -- invoice
          dotnet run -c Release --project samples/Papira.Samples -- features
          dotnet run -c Release --project samples/Papira.Samples -- archive
          dotnet run -c Release --project samples/Papira.Samples -- accessible
          dotnet run -c Release --project samples/Papira.Samples -- form
          dotnet run -c Release --project samples/Papira.Samples -- html

      - name: Check PDF structure with qpdf
        run: |
          for f in samples/Papira.Samples/bin/Release/net10.0/output/*.pdf; do
            echo "Checking $f"
            qpdf --check "$f"
          done

      - name: Install veraPDF
        run: |
          curl -sL -o verapdf-installer.zip https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q verapdf-installer.zip -d verapdf-installer
          cat > auto-install.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>${{ github.workspace }}/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="3" name="veraPDF Validation model" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar verapdf-installer/*/verapdf-izpack-installer-*.jar auto-install.xml

      - name: Validate the archivable invoice against PDF/A-3b
        run: ./verapdf/verapdf -f 3b --format text samples/Papira.Samples/bin/Release/net10.0/output/archive.pdf

      - name: Validate the accessible report against PDF/UA-1
        run: ./verapdf/verapdf -f ua1 --format text samples/Papira.Samples/bin/Release/net10.0/output/accessible.pdf

      - name: Validate the fillable form against PDF/UA-1
        run: ./verapdf/verapdf -f ua1 --format text samples/Papira.Samples/bin/Release/net10.0/output/form.pdf

      - name: Validate the HTML report against PDF/UA-1
        run: ./verapdf/verapdf -f ua1 --format text samples/Papira.Samples/bin/Release/net10.0/output/html.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: sample-pdfs
          path: samples/Papira.Samples/bin/Release/net10.0/output/*.pdf

  aot:
    name: Native AOT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The library says it can be trimmed and compiled ahead of time; this is what says so.
      - name: Publish a sample as a native binary
        run: |
          dotnet publish samples/Papira.Samples -c Release -f net10.0 -p:PublishAot=true \
            -p:TrimmerSingleWarn=false -o aot-output 2>&1 | tee aot.log
          if grep -qiE "warning (IL|AOT)" aot.log; then
            echo "Trimming or AOT warnings:"; grep -iE "warning (IL|AOT)" aot.log; exit 1
          fi

      - name: Generate documents with the native binary
        run: |
          cd aot-output
          ./Papira.Samples all
          ls -l output/*.pdf
          test -s output/invoice.pdf

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack src/Papira -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*
