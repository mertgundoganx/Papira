    .rule { stroke: #b0bec5; stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42a5f5"/>
      <stop offset="0.6" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#4527a0"/>
